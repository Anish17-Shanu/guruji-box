name: Desktop installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install desktop dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist

      - name: Smoke-test packaged application
        env:
          GURUJI_DESKTOP_EXE: ${{ github.workspace }}\desktop\release\win-unpacked\GURUJI BOX.exe
        run: npm run smoke

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: guruji-box-windows-installer
          path: desktop/release/*.exe
          retention-days: 30

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*.exe
          generate_release_notes: true
