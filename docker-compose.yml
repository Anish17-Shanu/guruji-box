services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: guruji
      POSTGRES_USER: guruji
      POSTGRES_PASSWORD: guruji
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guruji -d guruji"]
      interval: 5s
      timeout: 5s
      retries: 10
